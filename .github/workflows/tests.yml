# Runs the automatic tests on every push and pull request: unit tests (node --test) and the Playwright smoke tests
# (headless Chromium against a static server of the repository; tiles, geocoding and MapLibre blocked or stubbed).
name: Tests

on:
  push:
    paths-ignore: ['v/**']     # link-preview pages committed by the Worker
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (readers, pipeline on GB26 fixture, exports, i18n, Worker)
        run: node --test tests/*.test.js
  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright + Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Smoke tests (tests/smoke/run.mjs)
        run: node tests/smoke/run.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: /tmp/analyze-smoke
          if-no-files-found: ignore
          retention-days: 7
