# Deploys the Cloudflare Worker (worker/ → analyze-api on workers.dev) when something under worker/
# changes on main. The web app itself is published by GitHub Pages straight from the repository root.
# One-time D1 schema: run this workflow manually (Actions → Deploy worker → Run workflow) with
# "migrate" ticked – also after every change to worker/schema.sql (the schema is idempotent).
# Secrets needed (repo → Settings → Secrets and variables → Actions), see README §6:
#   CLOUDFLARE_API_TOKEN   – API token with Workers Scripts, D1 and Workers R2 Storage: Edit
#   CLOUDFLARE_ACCOUNT_ID  – the account ID shown in the Cloudflare dashboard
#   GH_DATA_TOKEN          – optional: fine-grained GitHub token (Contents: read on bwicki/gb_flight_data);
#                            pushed to the Worker as secret GITHUB_DATA_TOKEN so the Ereignislog can be linked
#   GH_PAGES_TOKEN         – optional: fine-grained GitHub token (Contents: read & write on bwicki/analyze);
#                            pushed as GITHUB_PAGES_TOKEN – the Worker commits link-preview pages v/<id>/index.html
#   (GitHub does not allow secret names starting with GITHUB_, hence the GH_ names here)
name: Deploy worker

on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:
    inputs:
      migrate:
        description: "Apply worker/schema.sql to the D1 database (first run and after schema changes)"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test tests/*.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_DATA_TOKEN: ${{ secrets.GH_DATA_TOKEN }}
      GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
      OPS_HANDOVER_TOKEN: ${{ secrets.OPS_HANDOVER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: D1 schema (only when requested)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate }}
        working-directory: worker
        run: npx --yes wrangler@4 d1 execute analyze --remote --file=schema.sql
      - name: Deploy Worker (analyze-api)
        working-directory: worker
        run: npx --yes wrangler@4 deploy
      - name: Worker secret GITHUB_DATA_TOKEN (only when the GitHub secret GH_DATA_TOKEN is set)
        if: ${{ env.GH_DATA_TOKEN != '' }}
        working-directory: worker
        env:
          GH_DATA_TOKEN: ${{ secrets.GH_DATA_TOKEN }}
        run: printf '%s' "$GH_DATA_TOKEN" | npx --yes wrangler@4 secret put GITHUB_DATA_TOKEN
      - name: Worker secret GITHUB_PAGES_TOKEN (only when the GitHub secret GH_PAGES_TOKEN is set)
        if: ${{ env.GH_PAGES_TOKEN != '' }}
        working-directory: worker
        env:
          GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
        run: printf '%s' "$GH_PAGES_TOKEN" | npx --yes wrangler@4 secret put GITHUB_PAGES_TOKEN
      - name: Worker secret OPS_HANDOVER_TOKEN (only when the GitHub secret OPS_HANDOVER_TOKEN is set)
        if: ${{ env.OPS_HANDOVER_TOKEN != '' }}
        working-directory: worker
        env:
          OPS_HANDOVER_TOKEN: ${{ secrets.OPS_HANDOVER_TOKEN }}
        run: printf '%s' "$OPS_HANDOVER_TOKEN" | npx --yes wrangler@4 secret put OPS_HANDOVER_TOKEN
