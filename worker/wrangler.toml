# analyze – Cloudflare Worker (API only; the web app is on GitHub Pages).
# Deployed by .github/workflows/deploy.yml (wrangler deploy). Secrets are NOT in this file.
# Address after the first deploy: https://analyze-api.<account subdomain>.workers.dev
# → enter it in src/config.js (apiBase). Same pattern as s2ground.wicki.aero / ops.wicki.aero.
name = "analyze-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# Browser origins allowed to call the API (CORS): the app on its own domain, the GitHub Pages
# fallback address and local development.
APP_ORIGINS = "https://analyze.wicki.aero,https://bwicki.github.io,http://localhost:8765,http://127.0.0.1:8765"
TOKEN_HOURS = "12"
# Public address of the app – used for the short links (analyze.wicki.aero/v/<id>).
APP_URL = "https://analyze.wicki.aero"
# Public address of this Worker (same value as apiBase in src/config.js) – the link-preview pages point
# messengers to the flight image here (/api/view/<id>/preview.jpg).
API_URL = "https://analyze-api.balthasar.workers.dev"
# Flights are kept this long after the last change (concept decision 9); the cleanup runs daily.
RETENTION_DAYS = "730"
# Ereignislog source (private repo of the gb_notion_frontend app). The token is a secret, NOT a var:
# GITHUB_DATA_TOKEN – set by the deploy workflow from the GitHub secret of the same name (README §6, step 8).
DATA_REPO = "bwicki/gb_flight_data"
DATA_BRANCH = "main"
DATA_DIR = "data"
PAGES_REPO = "bwicki/analyze"      # link-preview pages v/<id>/index.html are committed here (secret GITHUB_PAGES_TOKEN)
PAGES_BRANCH = "main"

# D1 database: create it once in the Cloudflare dashboard (Workers & Pages → D1 → "analyze")
# and paste its ID below (README step 3b). Apply worker/schema.sql via the "migrate" workflow input.
[[d1_databases]]
binding = "DB"
database_name = "analyze"
database_id = "555946b6-0726-45a8-a765-f7219fcea48d"

# R2 bucket for tracks, logos and reports: create it once in the dashboard (R2 → Create bucket → "analyze").
[[r2_buckets]]
binding = "FILES"
bucket_name = "analyze"

# Daily cleanup of flights older than RETENTION_DAYS and of expired admin tokens.
[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
